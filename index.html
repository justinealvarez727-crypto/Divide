</style></head><body><div id=app></div><div id=m></div><div id=t></div><div id=lb onclick="this.style.display='none'"></div><script>
const $=s=>document.querySelector(s),E=s=>String(s??'').replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';'),uid=()=>Math.random().toString(36).slice(2,9),today=()=>new Date().toISOString().slice(0,10);
let S;try{S=JSON.parse(localStorage.getItem('divvy1'))}catch(e){}if(!S||!S.groups)S={groups:[],log:[]};
const save=()=>{try{localStorage.setItem('divvy1',JSON.stringify(S))}catch(e){}};
const CUR={USD:'$',PHP:'₱',EUR:'€',GBP:'£',JPY:'¥',SGD:'S$',AUD:'A$',CAD:'C$',KRW:'₩',THB:'฿'};
const fmt=(c,cur)=>(c<0?'-':'')+(CUR[cur]||cur+' ')+(Math.abs(c)/100).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
const CATS={General:'🧾',Food:'🍽️',Groceries:'🛒',Transport:'🚗',Stay:'🏨',Fun:'🎬',Bills:'💡',Shopping:'🛍️',Travel:'✈️',Payment:'💸',Other:'📦'};
const KW={Food:/food|dinner|lunch|breakfast|resto|cafe|coffee|meal|pizza|drinks/i,Groceries:/grocer|market|mart/i,Transport:/taxi|grab|uber|gas|fuel|bus|toll|parking|fare|jeep|van|tricycle/i,Stay:/hotel|accom|airbnb|hostel|room|resort|lodg/i,Fun:/movie|ticket|tour|game|concert|entrance/i,Bills:/electric|water|wifi|internet|rent|bill/i,Travel:/flight|airfare|plane|ferry/i};
const G=id=>S.groups.find(g=>g.id==id),nm=(g,id)=>id=='me'?'You':(g.members.find(m=>m.id==id)||{name:'?'}).name;
const O=(a,s)=>a.map(([v,l])=>`<option value="${E(v)}" ${v==s?'selected':''}>${l}</option>`).join('');
const log=(g,t)=>{S.log.unshift({ts:Date.now(),g:g.id,t});S.log=S.log.slice(0,200)};
function toast(t,undo){const e=$('#t');e.innerHTML=E(t)+(undo?'<button id=ub>Undo</button>':'');e.style.display='block';if(undo)$('#ub').onclick=()=>{undo();e.style.display='none'};clearTimeout(toast.h);toast.h=setTimeout(()=>e.style.display='none',undo?5000:2600)}
const modal=h=>{$('#m').innerHTML='<div>'+h+'</div>';$('#m').className='on';loadImgs()},closeM=()=>{$('#m').className='';if(F&&!F.ok)(F.a||[]).forEach(x=>idb('del',x));F=null};
const DB=new Promise(r=>{try{const q=indexedDB.open('divvy-img',1);q.onupgradeneeded=()=>q.result.createObjectStore('i');q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)}catch(e){r(null)}});
const idb=(m,k,v)=>DB.then(d=>d?new Promise(r=>{try{const s=d.transaction('i',m=='get'?'readonly':'readwrite').objectStore('i'),q=m=='get'?s.get(k):m=='put'?s.put(v,k):s.delete(k);q.onsuccess=()=>r(q.result);q.onerror=()=>r()}catch(e){r()}}):null);
const loadImgs=()=>document.querySelectorAll('img[data-r]').forEach(i=>idb('get',i.dataset.r).then(d=>{if(d)i.src=d}));
const view=id=>idb('get',id).then(d=>{if(d){$('#lb').innerHTML='<img src="'+d+'">';$('#lb').style.display='grid'}});
function dist(t,w){const sw=w.reduce((a,b)=>a+b,0);if(!sw)return w.map(()=>0);const raw=w.map(x=>t*x/sw),f=raw.map(Math.floor);let r=t-f.reduce((a,b)=>a+b,0);raw.map((x,i)=>[x-f[i],i]).sort((a,b)=>b[0]-a[0]).slice(0,Math.max(r,0)).forEach(o=>f[o[1]]++);return f}
function calc(type,amt,ids,v,it){const sh={};if(!ids.length)return{sh,err:'Pick at least one person'};let a,err='';const c=i=>Math.round((+v[i]||0)*100);
 if(type=='equal')a=dist(amt,ids.map(()=>1));
 else if(type=='exact'){a=ids.map(c);const d=amt-a.reduce((x,y)=>x+y,0);if(d)err=(d>0?'Left to assign: ':'Over by: ')+Math.abs(d)/100}
 else if(type=='percent'){const p=ids.map(i=>+v[i]||0),s=p.reduce((x,y)=>x+y,0);if(Math.abs(s-100)>.001)err='Total is '+s+'%, needs 100%';a=dist(amt,p)}
 else if(type=='shares'){a=dist(amt,ids.map(i=>+v[i]||0))}
 else if(type=='items'){const sub={};ids.forEach(i=>sub[i]=0);let bad=0;it.items.forEach(x=>{const p=Math.round((+x.p||0)*100),w=(x.who||[]).filter(i=>ids.includes(i));if(!w.length){if(p)bad++;return}dist(p,w.map(()=>1)).forEach((c,k)=>sub[w[k]]+=c)});const ex=Math.round((+it.extra||0)*100),sv=Math.round((+it.svc||0)*100),ee=dist(ex,ids.map(i=>sub[i])),sw=dist(sv,ids.map(i=>sub[i]>0?1:0));a=ids.map((i,k)=>sub[i]+ee[k]+sw[k]);if(bad)err=bad+' item(s) not assigned';else if((ex||sv)&&!ids.some(i=>sub[i]))err='Add and assign items first'}
 else{const j=ids.map(c),b=amt-j.reduce((x,y)=>x+y,0);a=dist(b,ids.map(()=>1)).map((x,k)=>x+j[k])}
 ids.forEach((i,k)=>sh[i]=a[k]);return{sh,err}}
function nets(g){const n={};g.members.forEach(m=>n[m.id]=0);g.exp.forEach(e=>{for(const k in e.payers)n[k]=(n[k]||0)+e.payers[k];for(const k in e.shares)n[k]=(n[k]||0)-e.shares[k]});return n}
function debts(g,simp){if(simp){const n=nets(g),c=[],d=[],o=[];for(const k in n){if(n[k]>0)c.push([k,n[k]]);else if(n[k]<0)d.push([k,-n[k]])}c.sort((a,b)=>b[1]-a[1]);d.sort((a,b)=>b[1]-a[1]);let i=0,j=0;while(i<c.length&&j<d.length){const x=Math.min(c[i][1],d[j][1]);o.push({from:d[j][0],to:c[i][0],amt:x});c[i][1]-=x;d[j][1]-=x;if(!c[i][1])i++;if(!d[j][1])j++}return o}
 const P={};g.exp.forEach(e=>{if(!e.amt)return;for(const s in e.shares)for(const p in e.payers){if(s==p)continue;const v=e.shares[s]*e.payers[p]/e.amt;if(s<p)P[s+'|'+p]=(P[s+'|'+p]||0)+v;else P[p+'|'+s]=(P[p+'|'+s]||0)-v}});
 const o=[];for(const k in P){const[a,b]=k.split('|'),x=Math.round(P[k]);if(x>0)o.push({from:a,to:b,amt:x});else if(x<0)o.push({from:b,to:a,amt:-x})}return o}
let V={t:'home',tab:'exp'},F=null,ST=null;
const go=(t,gid,tab)=>{V={t,gid,tab:tab||'exp'};render();scrollTo(0,0)};
function render(){const a=$('#app');let h='';
 if(V.t=='group'&&G(V.gid))h=vGroup(G(V.gid));else if(V.t=='friends')h=vFriends();else if(V.t=='act')h=vAct();else if(V.t=='acct')h=vAcct();else h=vHome();
 const nv=[['home','👥','Groups'],['friends','🧑','Friends'],['act','🕘','Activity'],['acct','⚙️','Account']];
 a.innerHTML=h+`<nav><div>${nv.map(([k,i,l])=>`<button class="${(V.t==k||(k=='home'&&V.t=='group'))?'on':''}" onclick="go('${k}')">${i}<br>${l}</button>`).join('')}</div></nav>`+(S.groups.length?`<button class=fab onclick="openForm(${V.t=='group'?`'${V.gid}'`:''})">+ Add expense</button>`:'')}
function vHome(){const T={};S.groups.forEach(g=>{const m=nets(g).me||0;T[g.cur]=T[g.cur]||[0,0];T[g.cur][m>0?0:1]+=Math.abs(m)});
 const ts=Object.entries(T).map(([c,[a,b]])=>`<div>${a?`you are owed <b class=g>${fmt(a,c)}</b>`:''} ${b?`you owe <b class=o>${fmt(b,c)}</b>`:''}${!a&&!b?'all settled up':''}</div>`).join('');
 return `<div class=bar><b>Divvy</b><button onclick="newGroup()">＋</button></div><div class=sum><h2>Groups</h2>${ts}</div>`+(S.groups.length?`<div class=card>${S.groups.map(g=>{const m=nets(g).me||0;return `<div class=li onclick="go('group','${g.id}')"><div class=av>${E(g.name[0]||'G').toUpperCase()}</div><div><b>${E(g.name)}</b><br><small>${g.members.length} people · ${g.exp.length} entries</small></div><div class=r>${m?`<small>${m>0?'you are owed':'you owe'}</small><br><b class="${m>0?'g':'o'}">${fmt(Math.abs(m),g.cur)}</b>`:'<small>settled up</small>'}</div></div>`}).join('')}</div>`:`<div class=emp>No groups yet.<br><br><button class=btn onclick="newGroup()">Start a group</button></div>`)}
function newGroup(){modal(`<div class=bar><button onclick=closeM()>✕</button><b>New group</b><button onclick=mkGroup()>✓</button></div><div class=pad><label class=f>Group name</label><input id=gn placeholder="Trip to Elyu"><label class=f>Currency</label><select id=gc>${O(Object.keys(CUR).map(k=>[k,k+' '+CUR[k]]),S.groups[0]?.cur||'USD')}</select><label class=f>Other members (comma separated)</label><textarea id=gm placeholder="Ana, Ben, Carla"></textarea><p class=mu>You are added automatically. Debt simplification is on by default; change it in group settings.</p></div>`)}
function mkGroup(){const n=$('#gn').value.trim();if(!n)return toast('Name the group');const seen=new Set(),ms=[{id:'me',name:'You'}];$('#gm').value.split(',').map(x=>x.trim()).filter(Boolean).forEach(x=>{if(!seen.has(x.toLowerCase())){seen.add(x.toLowerCase());ms.push({id:uid(),name:x})}});
 const g={id:uid(),name:n,cur:$('#gc').value,simplify:true,members:ms,exp:[]};S.groups.unshift(g);log(g,'You created group "'+n+'"');save();closeM();go('group',g.id)}
function vGroup(g){const n=nets(g),my=n.me||0,d=debts(g,g.simplify),tab=V.tab;
 let h=`<div class=bar><button onclick="go('home')">‹</button><b>${E(g.name)}</b><button onclick="gset('${g.id}')">⚙︎</button></div><div class=sum><h2 class="${my>0?'g':my<0?'o':''}">${my>0?'You are owed '+fmt(my,g.cur):my<0?'You owe '+fmt(-my,g.cur):'You are settled up'}</h2></div><div style="padding:6px 14px;display:flex;gap:8px"><button class="btn" onclick="openSettle('${g.id}')">Settle up</button><button class="btn s" onclick="copySum('${g.id}')">Copy summary</button></div><div class=tabs>${[['exp','Expenses'],['bal','Balances'],['tot','Report']].map(([k,l])=>`<button class="${tab==k?'on':''}" onclick="go('group','${g.id}','${k}')">${l}</button>`).join('')}</div>`;
 if(tab=='exp'){if(!g.exp.length)return h+`<div class=emp>No expenses here yet.<br>Tap “Add expense” to start.</div>`;let last='';const L=[...g.exp].sort((a,b)=>b.date.localeCompare(a.date)||b.ts-a.ts);h+='<div class=card>';
  L.forEach(e=>{const mo=new Date(e.date+'T00:00').toLocaleDateString(undefined,{month:'long',year:'numeric'});if(mo!=last){h+=`</div><h3>${mo}</h3><div class=card>`;last=mo}
   const pk=Object.keys(e.payers),pay=e.self?'Each paid own share of':pk.length>1?pk.length+' people paid':nm(g,pk[0])+' paid',eff=(e.payers.me||0)-(e.shares.me||0),dt=new Date(e.date+'T00:00').toLocaleDateString(undefined,{month:'short',day:'numeric'});
   h+=e.type=='pay'?`<div class=li onclick="det('${g.id}','${e.id}')"><div class=av style="background:var(--mu)">💸</div><div><span class=mu>${nm(g,pk[0])} paid ${nm(g,Object.keys(e.shares)[0])} ${fmt(e.amt,g.cur)}</span><br><small>${dt}</small></div></div>`:
   `<div class=li onclick="det('${g.id}','${e.id}')"><div class=av>${CATS[e.cat]||'🧾'}</div><div><b>${E(e.desc)}</b>${e.rc?.length?' 📎':''}${e.cm?.length?' 💬'+e.cm.length:''}<br><small>${dt} · ${pay} ${fmt(e.amt,g.cur)}</small></div><div class=r>${eff?`<small>you ${eff>0?'lent':'borrowed'}</small><br><b class="${eff>0?'g':'o'}">${fmt(Math.abs(eff),g.cur)}</b>`:(e.self?'<small>paid own share</small>':'<small>not involved</small>')}</div></div>`});return h+'</div>'}
 if(tab=='bal'){h+=`<h3>${g.simplify?'Simplified payments':'Who owes whom'}</h3><div class=card>`+(d.length?d.map(x=>`<div class=li onclick="openSettle('${g.id}','${x.from}','${x.to}',${x.amt})"><div class=av>${E(nm(g,x.from)[0])}</div><div><b>${E(nm(g,x.from))}</b> ${x.from=='me'?'owe':'owes'} <b>${E(nm(g,x.to))}</b></div><div class="r ${x.from=='me'?'o':x.to=='me'?'g':''}"><b>${fmt(x.amt,g.cur)}</b></div></div>`).join(''):'<div class=emp>Everyone is settled up.</div>')+`</div><h3>Net balances</h3><div class=card>${g.members.map(m=>`<div class=li><div class=av>${E(m.name[0])}</div><div>${E(m.name)}</div><div class="r ${n[m.id]>0?'g':n[m.id]<0?'o':''}">${n[m.id]>0?'gets back ':n[m.id]<0?'owes ':''}<b>${fmt(Math.abs(n[m.id]),g.cur)}</b></div></div>`).join('')}</div><p class=mu style="margin:10px 14px">Tap a payment to record it as settled.</p>`;return h}
 
 
 return h+report(g)}

function saveS(){const g=G(ST.gid),a=Math.round(+ST.amt*100);if(a<=0||ST.from==ST.to)return toast('Pick two different people and an amount');g.exp.push({id:uid(),type:'pay',desc:'Payment',cat:'Payment',amt:a,date:ST.date,payers:{[ST.from]:a},shares:{[ST.to]:a},ts:Date.now()});log(g,`${nm(g,ST.from)} paid ${nm(g,ST.to)} ${fmt(a,g.cur)}`);save();closeM();V={t:'group',gid:g.id,tab:'bal'};render();toast('Payment recorded')}
function copySum(id){const g=G(id),d=debts(g,g.simplify),t=g.name+' – balances\n'+(d.map(x=>`${nm(g,x.from)} → ${nm(g,x.to)}: ${fmt(x.amt,g.cur)}`).join('\n')||'All settled up');(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast('Summary copied'),()=>modal(`<div class=bar><button onclick=closeM()>✕</button><b>Summary</b><span></span></div><div class=pad><textarea rows=8>${E(t)}</textarea></div>`))}
function vFriends(){const F2={};S.groups.forEach(g=>debts(g,false).forEach(x=>{if(x.from!='me'&&x.to!='me')return;const o=x.from=='me'?x.to:x.from,s=x.from=='me'?-1:1,k=nm(g,o).toLowerCase()+'|'+g.cur,r=F2[k]=F2[k]||{n:nm(g,o),c:g.cur,t:0,gs:[]};r.t+=s*x.amt;r.gs.push(g.name+': '+(s>0?'owes you ':'you owe ')+fmt(x.amt,g.cur))}));const L=Object.values(F2).filter(r=>r.t);
 return `<div class=bar><b>Friends</b><span></span></div>`+(L.length?`<div class=card>${L.map(r=>`<div class=li style="cursor:default"><div class=av>${E(r.n[0])}</div><div><b>${E(r.n)}</b><br><small>${r.gs.map(E).join('<br>')}</small></div><div class=r><small>${r.t>0?'owes you':'you owe'}</small><br><b class="${r.t>0?'g':'o'}">${fmt(Math.abs(r.t),r.c)}</b></div></div>`).join('')}</div>`:'<div class=emp>No outstanding balances with anyone.</div>')}
function vAct(){return `<div class=bar><b>Activity</b><span></span></div>`+(S.log.length?`<div class=card>${S.log.map(l=>{const g=G(l.g);return `<div class=li style="cursor:default"><div>${E(l.t)}<br><small>${g?E(g.name)+' · ':''}${new Date(l.ts).toLocaleString(undefined,{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})}</small></div></div>`}).join('')}</div>`:'<div class=emp>Nothing yet.</div>')}
function vAcct(){return `<div class=bar><b>Account</b><span></span></div><div class=card><div class=li onclick="exJ()"><div>Back up everything (JSON)</div></div><div class=li onclick="$('#imp').click()"><div>Restore from backup</div></div><div class=li onclick="exC()"><div>Export all expenses (CSV)</div></div><div class=li onclick="th()"><div>Toggle dark / light theme</div></div><div class=li onclick="rs()"><div class=o>Erase all data</div></div></div><input id=imp type=file accept=.json hidden onchange="im(this.files[0])"><p class=mu style="margin:14px">Data is stored in this browser only. Back up regularly, especially before clearing site data.</p>`}
function dl(n,t,m){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:m}));a.download=n;a.click()}
async function exJ(){const img={};for(const g of S.groups)for(const e of g.exp)for(const r of e.rc||[])img[r]=await idb('get',r);dl('divvy-backup.json',JSON.stringify({...S,img}),'application/json')}
function exC(){const r=[['Group','Date','Description','Category','Total','Currency','Paid by','Split']];S.groups.forEach(g=>g.exp.forEach(e=>r.push([g.name,e.date,e.desc,e.cat,e.amt/100,g.cur,Object.keys(e.payers).map(k=>nm(g,k)).join('+'),Object.entries(e.shares).map(([k,v])=>nm(g,k)+':'+v/100).join(' ')])));dl('divvy-expenses.csv',r.map(x=>x.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n'),'text/csv')}
function im(f){if(!f)return;f.text().then(t=>{try{const d=JSON.parse(t);if(!d.groups)throw 0;const im2=d.img||{};delete d.img;S=d;save();Promise.all(Object.entries(im2).map(([k,v])=>idb('put',k,v)));go('home');toast('Backup restored')}catch(e){toast('That file is not a Divvy backup')}})}
function th(){const r=document.documentElement,d=getComputedStyle(r).getPropertyValue('--bg').trim()=='#15181a';r.dataset.theme=d?'light':'dark'}
function rs(){if(confirm('Erase all groups and expenses?')){S={groups:[],log:[]};save();go('home')}}
render();if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{})</script></body></html>
